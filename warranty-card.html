<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warranty Card — Print Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paper:#EDEFF1;
    --ink:#14171B;
    --steel:#5B6470;
    --line:#DEE2E2;
    --signal:#1E8A8F;
    --signal-soft:#E4F3F3;
    --pass:#1F7A63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- on-screen chrome ---- */
  .toolbar{
    max-width:900px;margin:0 auto;padding:40px 24px 0;
  }
  .toolbar h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;margin:0 0 4px;
  }
  .toolbar p.sub{color:var(--steel);margin:0 0 24px;font-size:14px;}
  .panel{
    background:#F7F8F9;border:1px solid var(--line);
    padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;
    margin-bottom:28px;
  }
  .panel label{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:6px;
  }
  .panel input{
    width:100%;padding:9px 10px;border:1px solid var(--line);
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;background:#fff;color:var(--ink);
  }
  .panel .full{grid-column:1 / -1;}
  .btnrow{max-width:900px;margin:0 auto 32px;padding:0 24px;display:flex;gap:10px;}
  button{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
    padding:11px 20px;border:1px solid var(--signal);background:var(--signal);color:#fff;cursor:pointer;
    border-radius:8px;
  }
  button.secondary{background:transparent;color:var(--ink);}

  .preview-wrap{max-width:900px;margin:0 auto;padding:0 24px 60px;}
  .preview-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:12px;}
  .preview-wrap .card{box-shadow:0 12px 28px -12px rgba(20,23,27,.16);}

  /* ---- the card itself ---- */
  .card{
    width:3.5in;height:2in;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:0.16in 0.2in;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;
    overflow:hidden;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .card-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;}
  .card-brand .shopname{display:block;}
  .card-eyebrow{
    display:inline-flex;align-items:center;gap:3px;
    font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--signal);font-weight:600;margin-top:5px;
  }
  .card-eyebrow::before{content:'✓';font-family:'IBM Plex Sans',sans-serif;font-size:9px;}
  .qr-frame{
    flex:none;
    width:0.95in;height:0.95in;
    background:var(--signal-soft);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .qr-target{width:0.78in;height:0.78in;}
  .qr-target img, .qr-target canvas, .qr-target table{width:100% !important;height:100% !important;border-radius:4px;}

  .card-mid{
    display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;
  }
  .card-mid .lbl{color:var(--steel);letter-spacing:.05em;text-transform:uppercase;font-size:7.5px;}
  .card-mid .fill{border-bottom:1px dotted var(--line);height:13px;}

  .card-bottom{
    display:flex;justify-content:space-between;align-items:center;
    border-top:1px dashed var(--line);padding-top:6px;
  }
  .card-warranty{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10.5px;
    background:var(--signal-soft);color:var(--signal);
    padding:3px 9px;border-radius:20px;
  }
  .card-contact{font-size:7.5px;color:var(--steel);text-align:right;font-family:'IBM Plex Mono',monospace;}

  /* ---- print sheet (8-up, hidden on screen) ---- */
  .sheet{display:none;}

  @media print{
    @page{ size:letter; margin:0.4in; }
    body{background:#fff;}
    .toolbar, .btnrow, .preview-wrap{display:none;}
    .sheet{
      display:grid;
      grid-template-columns:repeat(2, 3.5in);
      grid-auto-rows:2in;
      gap:0.25in 0.3in;
      justify-content:center;
    }
    .card{border:1px dashed #A9CFCF;box-shadow:none;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Warranty card</h1>
  <p class="sub">Fill in your details, then print — 8 cards per sheet, ready to cut. The QR code links to your hosted policy page.</p>
</div>

<div class="panel">
  <div>
    <label>Shop / seller name</label>
    <input id="in-shop" value="Your Shop Name" oninput="renderAll()">
  </div>
  <div>
    <label>Contact (phone or email)</label>
    <input id="in-contact" value="you@email.com · (555) 555-1234" oninput="renderAll()">
  </div>
  <div class="full">
    <label>Policy page URL (encoded in QR)</label>
    <input id="in-url" value="https://yourdomain.com/warranty-policy" oninput="renderAll()">
  </div>
</div>

<div class="btnrow">
  <button onclick="window.print()">Print cards</button>
</div>

<div class="preview-wrap">
  <div class="preview-label">Preview — actual size 3.5" × 2"</div>
  <div class="card" id="preview-card"></div>
</div>

<div class="sheet" id="sheet"></div>

<template id="card-template">
  <div class="card-top">
    <div class="card-brand">
      <span class="shopname">Your Shop Name</span>
      <span class="card-eyebrow">Verified · Tested</span>
    </div>
    <div class="qr-frame"><div class="qr-target"></div></div>
  </div>
  <div class="card-mid">
    <div><div class="lbl">Model</div><div class="fill"></div></div>
    <div><div class="lbl">Sold</div><div class="fill"></div></div>
    <div><div class="lbl">IMEI (last 4)</div><div class="fill"></div></div>
    <div><div class="lbl">Grade</div><div class="fill"></div></div>
  </div>
  <div class="card-bottom">
    <div class="card-warranty">30-day warranty</div>
    <div class="card-contact">contact-line</div>
  </div>
</template>

<script>
function buildCard(){
  const tpl = document.getElementById('card-template');
  return tpl.content.cloneNode(true);
}

function renderAll(){
  const shop = document.getElementById('in-shop').value || 'Your Shop Name';
  const contact = document.getElementById('in-contact').value || '';
  const url = document.getElementById('in-url').value || 'https://example.com';

  // preview
  const preview = document.getElementById('preview-card');
  preview.innerHTML = '';
  preview.appendChild(buildCard());
  preview.querySelector('.shopname').textContent = shop;
  preview.querySelector('.card-contact').textContent = contact;
  new QRCode(preview.querySelector('.qr-target'), {text:url, width:200, height:200, correctLevel:QRCode.CorrectLevel.M});

  // 8-up print sheet
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '';
  for(let i=0;i<8;i++){
    const wrapper = document.createElement('div');
    wrapper.className = 'card';
    wrapper.appendChild(buildCard());
    wrapper.querySelector('.shopname').textContent = shop;
    wrapper.querySelector('.card-contact').textContent = contact;
    sheet.appendChild(wrapper);
    new QRCode(wrapper.querySelector('.qr-target'), {text:url, width:200, height:200, correctLevel:QRCode.CorrectLevel.M});
  }
}

renderAll();
</script>

</body>
</html>
